<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahlen-Perlenkette Profi</title>
    <style>
        body { 
            font-family: 'Arial Rounded MT Bold', sans-serif; 
            background-color: #e0f7fa; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 10px;
        }

        .game-container { 
            background: white; padding: 25px; border-radius: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            text-align: center; width: 100%; max-width: 480px; position: relative; 
        }

        .level-badge { 
            background: #ffd700; padding: 8px 20px; border-radius: 20px; 
            font-weight: bold; display: inline-block; margin-bottom: 20px;
        }

        /* Die Kurven-Logik */
        .chain-area {
            position: relative; padding: 20px 40px; margin: 0 auto;
        }

        /* Die Schnur zeichnet den Pfad (S-Kurve im Hintergrund) */
        .svg-cord {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; fill: none; stroke: #8d6e63; stroke-width: 6;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .row { 
            display: flex; justify-content: space-between; 
            margin-bottom: 45px; position: relative; z-index: 2; 
        }
        
        /* Die 2. und 4. Reihe etwas eingerückt für den Kurven-Look */
        .row:nth-child(even) { padding-left: 30px; }
        .row:nth-child(odd) { padding-right: 30px; }

        .bead, .bead-input { 
            width: 44px; height: 44px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-weight: bold; border: 2px solid #333; 
            box-shadow: 2px 3px 6px rgba(0,0,0,0.2); font-size: 1.2rem;
            background-color: white;
        }

        .color-red { background-color: #f44336; color: white; }
        .color-white { background-color: #ffffff; color: #333; }
        .color-gold { background-color: #ffcc00; border-color: #b8860b; box-shadow: 0 0 10px #ffd700; }

        input.bead-input { 
            background-color: #fff9c4; border: 3px dashed #f57c00; 
            text-align: center; outline: none; width: 42px; height: 42px;
        }

        /* Sirene / Warnleuchte */
        .alarm {
            display: none; width: 40px; height: 35px; margin: 10px auto;
            background: #ff9800; border-radius: 50% 50% 5px 5px;
            border: 3px solid #e65100; animation: blink 0.4s infinite alternate;
        }
        @keyframes blink {
            from { box-shadow: 0 0 5px #ff9800; filter: brightness(1); }
            to { box-shadow: 0 0 20px #ff9800; filter: brightness(1.3); }
        }

        button { padding: 12px 25px; font-size: 1.1rem; border-radius: 50px; border: none; cursor: pointer; margin: 10px; font-weight: bold; color: white; }
        .check-btn { background-color: #4caf50; }
        .next-btn { background-color: #2196f3; }

        #feedback { font-size: 1.3rem; font-weight: bold; margin-top: 10px; min-height: 1.5em; }
        #victory-screen { display: none; flex-direction: column; align-items: center; }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="game-ui">
            <div id="level-display" class="level-badge">Level 1</div>
            
            <div class="chain-area">
                <svg class="svg-cord" viewBox="0 0 400 360">
                    <path d="M 40 40 L 360 40 C 400 40 400 120 360 120 L 40 120 C 0 120 0 200 40 200 L 360 200 C 400 200 400 280 360 280 L 40 280" />
                </svg>
                <div id="bead-chain"></div>
            </div>
            
            <div id="warning-light" class="alarm"></div>
            
            <div class="controls">
                <button onclick="checkAllAnswers()" class="check-btn">Prüfen</button>
                <button onclick="initGame()" id="btn-next" style="display:none;" class="next-btn">Weiter</button>
            </div>
            <p id="feedback"></p>
        </div>

        <div id="victory-screen">
            <h1 style="font-size: 3rem; color: #e91e63;">Bravo! 🎊</h1>
            <p style="font-size: 1.5rem;">Du bist ein Mathe-König!</p>
            <button onclick="location.reload()" class="next-btn">Nochmal spielen</button>
        </div>
    </div>

    <script>
        let currentLevel = 1, solvedInLevel = 0, hiddenIndices = [];

        function initGame() {
            const chainBox = document.getElementById('bead-chain');
            chainBox.innerHTML = '';
            document.getElementById('feedback').innerText = '';
            document.getElementById('warning-light').style.display = 'none';
            document.getElementById('btn-next').style.display = 'none';
            
            const titles = ["", "Anfänger", "Fortgeschritten", "Meister"];
            document.getElementById('level-display').innerText = `Level ${currentLevel}: ${titles[currentLevel]} (${solvedInLevel + 1}/2)`;

            generateHiddenIndices();

            for (let r = 0; r < 4; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';
                for (let i = 1; i <= 5; i++) {
                    const num = r * 5 + i;
                    const wrapper = document.createElement('div');
                    
                    let colorClass = (Math.ceil(num / 5) % 2 !== 0) ? 'color-red' : 'color-white';
                    if (currentLevel === 3) colorClass = 'color-gold';

                    if (hiddenIndices.includes(num - 1)) {
                        const input = document.createElement('input');
                        input.type = 'number';
                        input.className = 'bead-input';
                        input.id = `input-${num}`;
                        input.dataset.answer = num;
                        input.oninput = function() { if (this.value.length >= this.dataset.answer.toString().length) focusNext(num); };
                        wrapper.appendChild(input);
                    } else {
                        const bead = document.createElement('div');
                        bead.className = `bead ${colorClass}`;
                        bead.innerText = num;
                        wrapper.appendChild(bead);
                    }
                    rowDiv.appendChild(wrapper);
                }
                chainBox.appendChild(rowDiv);
            }
        }

        function generateHiddenIndices() {
            hiddenIndices = [];
            const numToHide = (currentLevel === 3) ? 7 : 5;
            if (currentLevel < 3) {
                const dist = [1, 1, 1, 1]; dist[Math.floor(Math.random() * 4)]++;
                for (let q = 0; q < 4; q++) {
                    let count = 0;
                    while (count < dist[q]) {
                        let idx = q * 5 + Math.floor(Math.random() * 5);
                        let neighborOk = (currentLevel === 1) ? (!hiddenIndices.includes(idx-1) && !hiddenIndices.includes(idx+1)) : true;
                        if (!hiddenIndices.includes(idx) && neighborOk) { hiddenIndices.push(idx); count++; }
                    }
                }
            } else {
                while (hiddenIndices.length < numToHide) {
                    let idx = Math.floor(Math.random() * 20);
                    if (!hiddenIndices.includes(idx)) hiddenIndices.push(idx);
                }
            }
            hiddenIndices.sort((a, b) => a - b);
        }

        function focusNext(num) {
            const inputs = Array.from(document.querySelectorAll('.bead-input'));
            const idx = inputs.findIndex(inp => inp.id === `input-${num}`);
            if (idx < inputs.length - 1) inputs[idx + 1].focus();
        }

        function checkAllAnswers() {
            let allCorrect = true;
            document.querySelectorAll('.bead-input').forEach(input => {
                if (input.value == input.dataset.answer) {
                    input.style.backgroundColor = "#c8e6c9";
                } else {
                    input.style.backgroundColor = "#ffcdd2";
                    allCorrect = false;
                }
            });

            const fb = document.getElementById('feedback');
            const light = document.getElementById('warning-light');

            if (allCorrect) {
                solvedInLevel++;
                fb.innerText = "Spitze! 🌟"; fb.style.color = "green";
                light.style.display = 'none';
                if (solvedInLevel >= 2) {
                    if (currentLevel < 3) { currentLevel++; solvedInLevel = 0; }
                    else { 
                        document.getElementById('game-ui').style.display = 'none';
                        document.getElementById('victory-screen').style.display = 'flex';
                        return;
                    }
                }
                document.getElementById('btn-next').style.display = 'inline-block';
            } else {
                fb.innerText = "Huch! Probier's nochmal.";
                fb.style.color = "#e65100";
                light.style.display = 'block';
            }
        }
        window.onload = initGame;
    </script>
</body>
</html>
